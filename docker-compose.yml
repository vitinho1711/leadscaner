version: '3.8'
services:
  lead-scanner:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - lead-data:/app/data
      - wwebjs-auth:/app/.wwebjs_auth
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - DATA_DIR=/app/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lead-data:
  wwebjs-auth:
